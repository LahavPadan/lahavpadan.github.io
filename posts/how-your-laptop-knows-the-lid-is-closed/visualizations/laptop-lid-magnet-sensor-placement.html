<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall-effect laptop lid detection</title>
<script>
(() => {
  if (window.parent === window) return;

  const applyParentTheme = () => {
    try {
      const root = window.parent.document.documentElement;
      const body = window.parent.document.body;
      const raw = `${root.dataset.theme || ""} ${root.className || ""} ${body?.dataset?.theme || ""} ${body?.className || ""}`.toLowerCase();
      const next = raw.includes("dark") ? "dark" : raw.includes("light") ? "light" : "";
      if (document.documentElement.dataset.theme !== next) document.documentElement.dataset.theme = next;
    } catch (_) {}
  };

  applyParentTheme();

  try {
    const root = window.parent.document.documentElement;
    const body = window.parent.document.body;
    const observer = new MutationObserver(applyParentTheme);
    observer.observe(root, { attributes: true, attributeFilter: ["class", "data-theme"] });
    if (body) observer.observe(body, { attributes: true, attributeFilter: ["class", "data-theme"] });
  } catch (_) {}
})();
</script>
<style>
:root {
  color-scheme: light;
  --surface: var(--viz-surface, #fff);
  --surface-muted: var(--viz-surface-muted, #f5f6f2);
  --ink: var(--viz-ink, #1b2420);
  --muted: var(--viz-muted, #68736c);
  --border: var(--viz-border, #d6ddd7);
  --border-strong: var(--viz-border-strong, #a7b3aa);
  --accent: var(--viz-accent, #85295e);
  --accent-ink: var(--viz-accent-ink, #70204d);
  --accent-soft: var(--viz-accent-soft, #fdeef6);
  --accent-border: var(--viz-accent-border, #e8b2d1);
  --field: #315fae;
  --field-soft: rgba(49, 95, 174, .10);
  --magnet-n: #b74d42;
  --magnet-s: #315fae;
  --copper: #9b631b;
  --inactive: #919c95;
  --shadow: rgba(20, 31, 25, 0.06);
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --math-font: "STIX Two Math", "Cambria Math", "Latin Modern Math", Georgia, serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: var(--viz-surface, #171e19);
  --surface-muted: var(--viz-surface-muted, #1d2720);
  --ink: var(--viz-ink, #e9efeb);
  --muted: var(--viz-muted, #a7b5aa);
  --border: var(--viz-border, #344138);
  --border-strong: var(--viz-border-strong, #617168);
  --accent: var(--viz-accent, #ffb9df);
  --accent-ink: var(--viz-accent-ink, #ffb9df);
  --accent-soft: var(--viz-accent-soft, #3f2033);
  --accent-border: var(--viz-accent-border, #914f75);
  --field: #8bb2ff;
  --field-soft: rgba(139, 178, 255, .11);
  --magnet-n: #ef8177;
  --magnet-s: #8bb2ff;
  --copper: #e0a666;
  --inactive: #77827a;
  --shadow: rgba(0, 0, 0, .18);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; background: transparent; color: var(--ink); }
body { padding: clamp(7px, 1.8vw, 18px); font-family: var(--sans); }
button, input { font: inherit; }
button { color: inherit; }
.viz {
  width: min(1120px, 100%);
  margin: 0 auto;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: 0 18px 48px var(--shadow);
}
.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, .42fr);
  gap: 22px;
  align-items: center;
  padding: clamp(16px, 2.6vw, 25px);
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface) 76%);
}
.heading-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
.eyebrow {
  margin: 0;
  color: var(--accent-ink);
  font: 760 .68rem/1 var(--sans);
  letter-spacing: .1em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-size: clamp(1.25rem, 2.7vw, 1.9rem);
  font-weight: 560;
  line-height: 1.14;
  letter-spacing: -.026em;
}
.definition {
  margin: 8px 0 0;
  max-width: 700px;
  color: var(--muted);
  font-size: clamp(.92rem, 1.7vw, 1.06rem);
  line-height: 1.42;
}
.controls { min-width: 0; display: grid; gap: 8px; }
.control {
  min-width: 0;
  padding: 9px 11px 10px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.control-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: .74rem;
}
.control-label strong { color: var(--accent-ink); font-weight: 760; }
.control input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: var(--accent); }
.placement {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border: 1px solid var(--border);
  background: var(--surface);
}
.placement button {
  min-width: 0;
  border: 0;
  border-right: 1px solid var(--border);
  padding: 8px 7px;
  background: transparent;
  color: var(--muted);
  font-size: .69rem;
  font-weight: 690;
  line-height: 1.15;
  cursor: pointer;
}
.placement button:last-child { border-right: 0; }
.placement button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.figure { margin: 0; padding: clamp(11px, 2.3vw, 22px); }
.canvas { position: relative; overflow: hidden; border: 1px solid var(--border); background: var(--surface-muted); }
#plot { display: block; width: 100%; height: auto; touch-action: none; }
.plot-bg { fill: var(--surface-muted); }
.shell { fill: var(--surface); stroke: var(--border-strong); stroke-width: 2; }
.shell-edge { fill: color-mix(in srgb, var(--surface) 78%, var(--border)); stroke: var(--border-strong); stroke-width: 1.6; }
.screen { fill: color-mix(in srgb, var(--field-soft) 70%, var(--surface)); stroke: var(--border); stroke-width: 1.5; }
.screen-glow { fill: url(#screenGradient); opacity: .72; }
.keyboard-deck { fill: color-mix(in srgb, var(--surface) 80%, var(--border)); stroke: var(--border-strong); stroke-width: 1.5; }
.key { fill: var(--surface-muted); stroke: var(--border); stroke-width: 1; }
.pcb { fill: color-mix(in srgb, var(--accent-soft) 68%, var(--surface)); stroke: var(--accent); stroke-width: 1.7; }
.trace { fill: none; stroke: var(--copper); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.hinge { fill: var(--surface); stroke: var(--border-strong); stroke-width: 2; }
.hinge-core { fill: var(--border-strong); }
.magnet-body { stroke: color-mix(in srgb, var(--ink) 45%, transparent); stroke-width: 1.2; }
.magnet-n { fill: var(--magnet-n); }
.magnet-s { fill: var(--magnet-s); }
.pole-letter { fill: #fff; font: 760 10px/1 var(--sans); dominant-baseline: middle; text-anchor: middle; }
.sensor-chip { fill: var(--ink); stroke: var(--surface); stroke-width: 1.3; }
.sensor-pin { stroke: var(--copper); stroke-width: 1.8; }
.ec-chip { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.ec-text { fill: var(--accent-ink); font: 760 11px/1 var(--sans); text-anchor: middle; dominant-baseline: middle; }
.field-ring { fill: none; stroke: var(--field); stroke-width: 1.45; opacity: .22; }
.field-ring.strong { stroke-width: 2.2; }
.sensor-halo { fill: var(--field-soft); stroke: var(--field); stroke-width: 1.7; }
.sensor-halo.detected { fill: color-mix(in srgb, var(--accent-soft) 75%, transparent); stroke: var(--accent); }
.label-box { fill: color-mix(in srgb, var(--surface) 96%, transparent); stroke: var(--border); stroke-width: 1; filter: url(#softShadow); }
.label-box.accent { stroke: var(--accent-border); }
.label-title { fill: var(--ink); font: 740 13px/1.15 var(--sans); }
.label-note { fill: var(--muted); font: 500 11px/1.2 var(--sans); }
.leader { fill: none; stroke: var(--border-strong); stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
.leader.accent { stroke: var(--accent); }
.target { fill: var(--border-strong); }
.target.accent { fill: var(--accent); }
.small-label { fill: var(--muted); font: 660 11px/1 var(--sans); paint-order: stroke; stroke: var(--surface-muted); stroke-width: 4px; stroke-linejoin: round; }
.small-label.strong { fill: var(--accent-ink); }
.angle-arc { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; }
.angle-guide { fill: none; stroke: var(--border-strong); stroke-width: 1.2; stroke-dasharray: 5 5; }
.angle-text { fill: var(--accent-ink); font: 760 12px/1 var(--sans); }
.mobile-only { display: none; }
.drag-zone { fill: transparent; cursor: grab; }
.drag-zone:active { cursor: grabbing; }
.status-strip { display: grid; grid-template-columns: 1.08fr .88fr 1.15fr 1.12fr; border: 1px solid var(--border); border-top: 0; background: var(--surface); }
.status-item {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 9px;
  color: var(--muted);
  font-size: clamp(.68rem, 1.1vw, .79rem);
  line-height: 1.25;
  text-align: center;
}
.status-item + .status-item { border-left: 1px solid var(--border); }
.status-item strong { color: var(--ink); font-weight: 740; }
.status-item.state strong { color: var(--inactive); }
.status-item.state.detected strong { color: var(--accent-ink); }
.swatch { flex: 0 0 auto; display: inline-block; }
.swatch.magnet { width: 20px; height: 9px; border: 1px solid var(--border-strong); background: linear-gradient(90deg, var(--magnet-n) 0 50%, var(--magnet-s) 50%); }
.swatch.field { width: 20px; height: 10px; border: 2px solid var(--field); border-radius: 50%; opacity: .72; }
.swatch.sensor { width: 13px; height: 10px; background: var(--ink); box-shadow: -4px 0 0 -2px var(--copper), 4px 0 0 -2px var(--copper); }
.swatch.signal { width: 20px; height: 0; border-top: 2px solid var(--copper); }
@media (max-width: 820px) {
  .topbar { grid-template-columns: 1fr; }
  .status-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .status-item:nth-child(3) { border-left: 0; border-top: 1px solid var(--border); }
  .status-item:nth-child(4) { border-top: 1px solid var(--border); }
}
@media (max-width: 560px) {
  body { padding: 5px; }
  .topbar { padding: 14px; }
  .figure { padding: 8px; }
  .placement button { padding: 7px 4px; font-size: .61rem; }
  .status-strip { grid-template-columns: 1fr; }
  .status-item + .status-item, .status-item:nth-child(3), .status-item:nth-child(4) { border-left: 0; border-top: 1px solid var(--border); }
  .desktop-only { display: none; }
  .mobile-only { display: block; }
  .label-title.mobile-only { font-size: 22px; }
  .small-label { font-size: 20px; }
  .small-label.strong { display: none; }
  .angle-text { font-size: 19px; }
}
</style>
</head>
<body>
<main class="viz">
  <header class="topbar">
    <div>
      <div class="heading-row">
        <p class="eyebrow">Hall-effect lid sensor</p>
        <h1>Lid detection without a wire through the hinge</h1>
      </div>
      <p class="definition">The lid carries only a passive permanent magnet. The powered Hall sensor and the electrical signal path remain inside the laptop base.</p>
    </div>

    <div class="controls">
      <label class="control" for="opening">
        <span class="control-label">
          <span>open or close the lid</span>
          <strong id="angleReadout">78° open</strong>
        </span>
        <input id="opening" type="range" min="0" max="105" step="1" value="78" aria-label="Laptop lid opening angle">
      </label>
      <div class="placement" role="group" aria-label="Common magnet and sensor placements">
        <button type="button" data-layout="bezel" aria-pressed="true">lower bezel</button>
        <button type="button" data-layout="corner" aria-pressed="false">display corner</button>
        <button type="button" data-layout="hinge" aria-pressed="false">near hinge</button>
      </div>
    </div>
  </header>

  <figure class="figure">
    <div class="canvas" id="canvas">
      <svg id="plot" viewBox="0 0 1000 710" role="img" aria-labelledby="plotTitle plotDescription" preserveAspectRatio="xMidYMid meet">
        <title id="plotTitle">Laptop lid magnet and Hall-effect sensor</title>
        <desc id="plotDescription">A side cross-section of a laptop. The lid rotates around the hinge. A permanent magnet in the lid approaches a Hall sensor soldered to a circuit board in the base. When the field at the sensor crosses a threshold, the embedded controller receives a lid-closed event.</desc>
        <defs>
          <linearGradient id="screenGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--field)" stop-opacity=".18"></stop>
            <stop offset="1" stop-color="var(--accent)" stop-opacity=".05"></stop>
          </linearGradient>
          <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--shadow)"></feDropShadow>
          </filter>
          <marker id="arrowAccent" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="var(--accent)"></path>
          </marker>
        </defs>

        <rect class="plot-bg" x="0" y="0" width="1000" height="710"></rect>

        <g id="base">
          <path class="keyboard-deck" d="M104 521 L820 521 L925 555 L120 555 Z"></path>
          <path class="shell" d="M120 555 L925 555 L902 605 L142 605 Z"></path>
          <path class="shell-edge" d="M142 605 L902 605 L884 619 L164 619 Z"></path>

          <g aria-hidden="true">
            <rect class="key" x="205" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="253" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="301" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="349" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="397" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="445" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="493" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="541" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="589" y="530" width="41" height="10" rx="2"></rect>
            <rect class="key" x="637" y="530" width="41" height="10" rx="2"></rect>
          </g>

          <rect class="pcb" x="235" y="572" width="573" height="18" rx="3"></rect>
          <path id="signalTrace" class="trace"></path>
          <rect class="ec-chip" x="365" y="563" width="70" height="36" rx="4"></rect>
          <text class="ec-text" x="400" y="581">EC</text>

          <g id="sensorAssembly">
            <circle id="sensorHalo" class="sensor-halo" cx="0" cy="0" r="17"></circle>
            <line class="sensor-pin" x1="-9" y1="6" x2="-9" y2="17"></line>
            <line class="sensor-pin" x1="0" y1="6" x2="0" y2="17"></line>
            <line class="sensor-pin" x1="9" y1="6" x2="9" y2="17"></line>
            <rect class="sensor-chip" x="-15" y="-7" width="30" height="15" rx="3"></rect>
          </g>

          <circle class="hinge" cx="820" cy="521" r="18"></circle>
          <circle class="hinge-core" cx="820" cy="521" r="5"></circle>
        </g>

        <g id="fieldRings" aria-hidden="true">
          <ellipse class="field-ring strong" rx="43" ry="25"></ellipse>
          <ellipse class="field-ring" rx="76" ry="43"></ellipse>
          <ellipse class="field-ring" rx="111" ry="63"></ellipse>
          <ellipse class="field-ring" rx="148" ry="84"></ellipse>
        </g>

        <g id="lidGroup">
          <path class="shell" d="M-664 -54 L0 -54 L0 -9 L-650 -9 Z"></path>
          <rect class="screen" x="-625" y="-48" width="567" height="32" rx="3"></rect>
          <rect class="screen-glow" x="-625" y="-48" width="567" height="32" rx="3"></rect>
          <path class="shell-edge" d="M-664 -54 L-650 -9 L-636 -16 L-644 -47 Z"></path>
          <g id="magnetAssembly">
            <rect class="magnet-body magnet-n" x="-18" y="-8" width="18" height="16" rx="2"></rect>
            <rect class="magnet-body magnet-s" x="0" y="-8" width="18" height="16" rx="2"></rect>
            <text class="pole-letter" x="-9" y=".5">N</text>
            <text class="pole-letter" x="9" y=".5">S</text>
          </g>
          <rect id="lidDragZone" class="drag-zone" x="-670" y="-66" width="680" height="72" aria-label="Drag the display lid"></rect>
        </g>

        <g aria-hidden="true">
          <path id="closedGuide" class="angle-guide"></path>
          <path id="angleArc" class="angle-arc" marker-end="url(#arrowAccent)"></path>
          <text id="angleText" class="angle-text">78°</text>
        </g>

        <g id="magnetCallout">
          <rect class="label-box" x="42" y="44" width="230" height="68" rx="5"></rect>
          <text class="label-title desktop-only" x="57" y="67">Permanent magnet in the lid</text>
          <text class="label-note desktop-only" x="57" y="88">Passive: no wires and no power.</text>
          <text class="label-title mobile-only" x="57" y="85">Permanent magnet</text>
          <polyline id="magnetLeader" class="leader"></polyline>
          <circle id="magnetTarget" class="target" r="3.4"></circle>
        </g>

        <g id="sensorCallout">
          <rect class="label-box accent" x="710" y="41" width="247" height="82" rx="5"></rect>
          <text class="label-title desktop-only" x="725" y="65">Hall-effect sensor in the base</text>
          <text class="label-note desktop-only" x="725" y="87">Soldered to a board and powered</text>
          <text class="label-note desktop-only" x="725" y="103">from the laptop electronics.</text>
          <text class="label-title mobile-only" x="725" y="88">Hall sensor IC</text>
          <polyline id="sensorLeader" class="leader accent"></polyline>
          <circle id="sensorTarget" class="target accent" r="3.4"></circle>
        </g>

        <text id="fieldLabel" class="small-label strong">magnetic field passes through the casing</text>
        <text id="placementLabel" class="small-label">lower bezel ↔ beneath the palm rest</text>
      </svg>
    </div>

    <div class="status-strip" aria-label="Physical roles and current state">
      <div class="status-item"><i class="swatch magnet"></i><span><strong>lid:</strong> passive magnet only</span></div>
      <div class="status-item"><i class="swatch field"></i><span id="fieldReadout"><strong>field at sensor:</strong> weak</span></div>
      <div class="status-item"><i class="swatch sensor"></i><span><strong>base:</strong> Hall IC on circuit board</span></div>
      <div id="stateItem" class="status-item state"><i class="swatch signal"></i><span><strong id="stateReadout">magnet not detected</strong> · no lid-close event</span></div>
    </div>
  </figure>
</main>

<script>
(() => {
  "use strict";

  const svg = document.getElementById("plot");
  const canvas = document.getElementById("canvas");
  const openingInput = document.getElementById("opening");
  const angleReadout = document.getElementById("angleReadout");
  const angleText = document.getElementById("angleText");
  const lidGroup = document.getElementById("lidGroup");
  const lidDragZone = document.getElementById("lidDragZone");
  const magnetAssembly = document.getElementById("magnetAssembly");
  const sensorAssembly = document.getElementById("sensorAssembly");
  const fieldRings = document.getElementById("fieldRings");
  const sensorHalo = document.getElementById("sensorHalo");
  const signalTrace = document.getElementById("signalTrace");
  const fieldReadout = document.getElementById("fieldReadout");
  const stateItem = document.getElementById("stateItem");
  const stateReadout = document.getElementById("stateReadout");
  const fieldLabel = document.getElementById("fieldLabel");
  const placementLabel = document.getElementById("placementLabel");
  const layoutButtons = [...document.querySelectorAll("[data-layout]")];

  const hinge = { x: 820, y: 521 };
  const sensorY = 552;
  const layouts = {
    bezel: {
      magnetX: -210,
      sensorX: 610,
      label: "lower bezel ↔ beneath the palm rest",
      shortLabel: "bezel ↔ palm rest"
    },
    corner: {
      magnetX: -520,
      sensorX: 300,
      label: "display corner ↔ corresponding base corner",
      shortLabel: "corner ↔ matching base corner"
    },
    hinge: {
      magnetX: -63,
      sensorX: 757,
      label: "near hinge ↔ motherboard or daughterboard",
      shortLabel: "near hinge ↔ nearby board"
    }
  };

  let activeLayout = "bezel";
  let dragging = false;
  let lastReportedHeight = 0;

  const clamp = (value, minimum, maximum) => Math.max(minimum, Math.min(maximum, value));
  const degreesToRadians = degrees => degrees * Math.PI / 180;

  function localToWorld(point, rotationDegrees) {
    const angle = degreesToRadians(rotationDegrees);
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    return {
      x: hinge.x + point.x * cosine - point.y * sine,
      y: hinge.y + point.x * sine + point.y * cosine
    };
  }

  function setPolyline(id, points) {
    document.getElementById(id).setAttribute("points", points.map(point => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" "));
  }

  function setTarget(id, point) {
    const element = document.getElementById(id);
    element.setAttribute("cx", point.x.toFixed(1));
    element.setAttribute("cy", point.y.toFixed(1));
  }

  function angleArcPath(openingDegrees) {
    const visualDegrees = openingDegrees * .8;
    const radius = 64;
    const start = { x: hinge.x - radius, y: hinge.y };
    const endAngle = degreesToRadians(180 + visualDegrees);
    const end = {
      x: hinge.x + radius * Math.cos(endAngle),
      y: hinge.y + radius * Math.sin(endAngle)
    };
    return `M${start.x} ${start.y} A${radius} ${radius} 0 0 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
  }

  function strengthWord(strength, detected) {
    if (detected) return "above threshold";
    if (strength > .36) return "near threshold";
    return "weak";
  }

  function render() {
    const layout = layouts[activeLayout];
    const opening = Number(openingInput.value);
    const visualRotation = opening * .8;

    lidGroup.setAttribute("transform", `translate(${hinge.x} ${hinge.y}) rotate(${visualRotation})`);
    magnetAssembly.setAttribute("transform", `translate(${layout.magnetX} -30)`);

    const magnet = localToWorld({ x: layout.magnetX, y: -30 }, visualRotation);
    const sensor = { x: layout.sensorX, y: sensorY };
    const distance = Math.hypot(magnet.x - sensor.x, magnet.y - sensor.y);
    const distanceStrength = clamp((192 - distance) / 150, 0, 1);
    const alignment = Math.exp(-Math.pow(opening / 28, 2));
    const strength = distanceStrength * alignment;
    const detected = strength >= .58;

    sensorAssembly.setAttribute("transform", `translate(${sensor.x} ${sensor.y})`);
    sensorHalo.classList.toggle("detected", detected);
    sensorHalo.setAttribute("r", (15 + 8 * strength).toFixed(1));

    fieldRings.setAttribute("transform", `translate(${magnet.x.toFixed(2)} ${magnet.y.toFixed(2)}) rotate(${visualRotation}) scale(${(.76 + .24 * strength).toFixed(3)})`);
    [...fieldRings.querySelectorAll("ellipse")].forEach((ring, index) => {
      ring.style.opacity = String(.10 + strength * (.11 + index * .035));
    });

    const traceStartX = sensor.x;
    signalTrace.setAttribute("d", `M${traceStartX} 569 L${traceStartX} 581 L435 581`);

    document.getElementById("closedGuide").setAttribute("d", `M${hinge.x - 84} ${hinge.y}L${hinge.x - 24} ${hinge.y}`);
    document.getElementById("angleArc").setAttribute("d", angleArcPath(opening));
    const textAngle = degreesToRadians(180 + visualRotation * .5);
    angleText.setAttribute("x", (hinge.x + 88 * Math.cos(textAngle)).toFixed(1));
    angleText.setAttribute("y", (hinge.y + 88 * Math.sin(textAngle) + 4).toFixed(1));
    angleText.setAttribute("text-anchor", "middle");
    angleText.textContent = `${opening}°`;

    const magnetLeaderStart = { x: 272, y: 82 };
    const magnetElbow = {
      x: clamp(magnet.x - 22, 285, 665),
      y: clamp(magnet.y - 25, 129, 356)
    };
    setPolyline("magnetLeader", [
      magnetLeaderStart,
      { x: magnetLeaderStart.x + 26, y: magnetLeaderStart.y },
      magnetElbow,
      magnet
    ]);
    setTarget("magnetTarget", magnet);

    const sensorLeaderStart = { x: 710, y: 90 };
    const sensorElbow = {
      x: clamp(sensor.x + 18, 610, 882),
      y: 154
    };
    setPolyline("sensorLeader", [
      sensorLeaderStart,
      { x: sensorLeaderStart.x - 26, y: sensorLeaderStart.y },
      sensorElbow,
      sensor
    ]);
    setTarget("sensorTarget", sensor);

    const middle = { x: (magnet.x + sensor.x) / 2, y: (magnet.y + sensor.y) / 2 };
    fieldLabel.setAttribute("x", clamp(middle.x, 260, 760).toFixed(1));
    fieldLabel.setAttribute("y", clamp(middle.y - 22, 175, 497).toFixed(1));
    fieldLabel.setAttribute("text-anchor", "middle");

    placementLabel.setAttribute("x", sensor.x.toFixed(1));
    placementLabel.setAttribute("y", "638");
    placementLabel.setAttribute("text-anchor", "middle");
    placementLabel.textContent = window.innerWidth <= 560 ? layout.shortLabel : layout.label;

    angleReadout.textContent = opening === 0 ? "closed" : `${opening}° open`;
    fieldReadout.innerHTML = `<strong>field at sensor:</strong> ${strengthWord(strength, detected)}`;
    stateItem.classList.toggle("detected", detected);
    stateReadout.textContent = detected ? "magnet detected" : "magnet not detected";
    stateReadout.nextSibling.textContent = detected ? " · lid-close event" : " · no lid-close event";

    reportHeight();
  }

  function openingFromPointer(event) {
    const rectangle = svg.getBoundingClientRect();
    const x = (event.clientX - rectangle.left) * 1000 / rectangle.width;
    const y = (event.clientY - rectangle.top) * 710 / rectangle.height;
    const raw = Math.atan2(y - hinge.y, x - hinge.x) * 180 / Math.PI;
    let visual = raw - 180;
    while (visual < 0) visual += 360;
    if (visual > 180) visual = 0;
    return clamp(Math.round(visual / .8), 0, 105);
  }

  lidDragZone.addEventListener("pointerdown", event => {
    dragging = true;
    lidDragZone.setPointerCapture(event.pointerId);
    openingInput.value = openingFromPointer(event);
    render();
  });
  lidDragZone.addEventListener("pointermove", event => {
    if (!dragging) return;
    openingInput.value = openingFromPointer(event);
    render();
  });
  lidDragZone.addEventListener("pointerup", event => {
    dragging = false;
    if (lidDragZone.hasPointerCapture(event.pointerId)) lidDragZone.releasePointerCapture(event.pointerId);
  });
  lidDragZone.addEventListener("pointercancel", () => { dragging = false; });

  openingInput.addEventListener("input", render);
  layoutButtons.forEach(button => {
    button.addEventListener("click", () => {
      activeLayout = button.dataset.layout;
      layoutButtons.forEach(candidate => candidate.setAttribute("aria-pressed", String(candidate === button)));
      render();
    });
  });

  function reportHeight() {
    if (window.parent === window) return;
    const target = document.querySelector(".viz") || document.body;
    const rectangle = target.getBoundingClientRect();
    const height = Math.max(1, Math.ceil(rectangle.bottom + window.scrollY));
    if (Math.abs(height - lastReportedHeight) < 2) return;
    lastReportedHeight = height;
    try {
      const targetOrigin = window.location.origin === "null" ? "*" : window.location.origin;
      window.parent.postMessage({ type: "article-visualization-height", height }, targetOrigin);
    } catch (_) {}
  }

  render();
  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(reportHeight);
    observer.observe(document.querySelector(".viz") || document.body);
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", render);
})();
</script>
</body>
</html>
