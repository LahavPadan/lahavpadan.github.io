<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transverse momentum and angular momentum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Mono:wght@400..700&display=swap">
<script>
(() => {
  try {
    const root = window.parent.document.documentElement;
    const body = window.parent.document.body;
    const raw = `${root.dataset.theme || ""} ${root.className || ""} ${body?.dataset?.theme || ""} ${body?.className || ""}`.toLowerCase();
    document.documentElement.dataset.theme = raw.includes("dark") ? "dark" : raw.includes("light") ? "light" : "";
  } catch (_) {}
})();
</script>
<style>
:root {
  color-scheme: light;
  --surface: var(--viz-surface, #fff);
  --surface-muted: var(--viz-surface-muted, #f5f6f2);
  --ink: var(--viz-ink, #1b2420);
  --muted: var(--viz-muted, #68736c);
  --border: var(--viz-border, #d6ddd7);
  --border-strong: var(--viz-border-strong, #a7b3aa);
  --accent: var(--viz-accent, #0d7659);
  --accent-ink: var(--viz-accent-ink, #095f48);
  --accent-soft: var(--viz-accent-soft, #dcefe7);
  --accent-border: var(--viz-accent-border, #91c7b6);
  --longitudinal: #315fae;
  --transverse: #7a56b1;
  --profile: #a25a24;
  --zero: #8b9690;
  --shadow: rgba(20, 31, 25, .06);
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --math-font: "STIX Two Math", "Cambria Math", "Latin Modern Math", Georgia, serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: var(--viz-surface, #171e19);
  --surface-muted: var(--viz-surface-muted, #1d2720);
  --ink: var(--viz-ink, #e9efeb);
  --muted: var(--viz-muted, #a7b5aa);
  --border: var(--viz-border, #344138);
  --border-strong: var(--viz-border-strong, #617168);
  --accent: var(--viz-accent, #63d2aa);
  --accent-ink: var(--viz-accent-ink, #8ee7c6);
  --accent-soft: var(--viz-accent-soft, #16362c);
  --accent-border: var(--viz-accent-border, #3c7964);
  --longitudinal: #8bb2ff;
  --transverse: #cba9ff;
  --profile: #efa56d;
  --zero: #7f8a83;
  --shadow: rgba(0, 0, 0, .18);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; background: transparent; color: var(--ink); }
body { padding: clamp(7px, 1.8vw, 18px); font-family: var(--sans); }
button, input { font: inherit; }
mjx-container { margin: 0 !important; }
.viz {
  width: min(1120px, 100%);
  margin: 0 auto;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: 0 18px 48px var(--shadow);
}
.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: clamp(16px, 2.6vw, 25px);
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface) 76%);
}
.heading-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
.eyebrow {
  margin: 0;
  color: var(--accent-ink);
  font: 760 .68rem/1 var(--sans);
  letter-spacing: .1em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-size: clamp(1.25rem, 2.7vw, 1.9rem);
  font-weight: 560;
  line-height: 1.14;
  letter-spacing: -.026em;
}
.definition {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: clamp(.90rem, 1.55vw, 1.03rem);
  line-height: 1.42;
}
.definition mjx-container { display: inline-block !important; }
.controls {
  display: grid;
  grid-template-columns: auto minmax(126px, 166px) auto;
  gap: 6px;
  align-items: stretch;
}
.phase-control {
  min-width: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  align-content: center;
  padding: 5px 8px 6px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.phase-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: .58rem;
  font-weight: 760;
  line-height: 1;
  letter-spacing: .085em;
  text-transform: uppercase;
}
.phase-label strong {
  color: var(--accent-ink);
  font-family: var(--mono);
  font-size: .64rem;
  font-weight: 600;
  letter-spacing: 0;
}
.phase-control input[type="range"] {
  width: 100%;
  min-width: 0;
  margin: 0;
  height: 12px;
  accent-color: var(--accent);
}
.scenario-tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(78px, auto));
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.scenario-button,
.helicity-button {
  min-height: 39px;
  padding: 6px 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: .66rem;
  font-weight: 760;
  line-height: 1.15;
  letter-spacing: .045em;
  text-transform: uppercase;
  white-space: nowrap;
}
.scenario-button[aria-pressed="true"] {
  border-color: var(--accent-border);
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.helicity-control {
  display: grid;
  grid-template-columns: repeat(2, 36px);
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.helicity-button {
  min-height: 39px;
  padding: 0;
  border-color: var(--border);
  color: var(--transverse);
  font-size: 1rem;
  line-height: 1;
  text-transform: none;
}
.helicity-button[aria-pressed="true"] {
  border-color: var(--transverse);
  background: color-mix(in srgb, var(--transverse) 16%, var(--surface));
  color: var(--transverse);
}
.helicity-control.is-disabled { opacity: .38; pointer-events: none; }
.scenario-button:focus-visible,
.helicity-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.figure { margin: 0; padding: clamp(10px, 2.1vw, 21px); }
.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.36fr) minmax(330px, .88fr);
  gap: 10px;
  align-items: stretch;
}
.panel {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface-muted);
}
.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  min-height: 43px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.panel-head strong {
  color: var(--ink);
  font-size: .69rem;
  font-weight: 760;
  letter-spacing: .085em;
  text-transform: uppercase;
}
.panel-head span {
  color: var(--muted);
  font-size: .72rem;
  line-height: 1.25;
  text-align: right;
}
.beam-wrap { position: relative; background: var(--surface-muted); }
.math-layer { position: absolute; inset: 0; pointer-events: none; }
.math-chip {
  position: absolute;
  z-index: 4;
  padding: 2px 6px;
  border: 1px solid color-mix(in srgb, var(--border) 84%, transparent);
  border-radius: 4px;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  box-shadow: 0 2px 8px var(--shadow);
  color: var(--ink);
  font-size: clamp(.72rem, 1vw, .88rem);
  line-height: 1.08;
  white-space: nowrap;
  transform: translate(-50%, -50%);
}
.math-chip mjx-container { margin: 0 !important; }
.math-chip.transverse { color: var(--transverse); }
.math-chip.longitudinal { color: var(--longitudinal); }
.math-chip.accent { color: var(--accent-ink); }
#beamPlot { display: block; width: 100%; height: auto; }
.plot-bg { fill: var(--surface-muted); }
.plot-frame { fill: none; stroke: var(--border); stroke-width: 1.15; }
.grid-line { stroke: var(--border); stroke-width: 1; opacity: .62; }
.axis-line { stroke: var(--border-strong); stroke-width: 1.15; }
.axis-label,
.svg-ui,
.svg-note { font-family: var(--sans); }
.axis-label { fill: var(--muted); font-size: 13px; font-weight: 700; }
.svg-ui { fill: var(--ink); font-size: 13px; font-weight: 720; }
.svg-note { fill: var(--muted); font-size: 12px; }
.svg-math { fill: var(--ink); font-family: var(--math-font); font-size: 18px; font-style: italic; }
.uniform-field { fill: color-mix(in srgb, var(--longitudinal) 11%, transparent); }
.finite-field { opacity: 0; }
.profile-ring { fill: none; stroke: var(--profile); stroke-width: 1.2; opacity: .18; }
.profile-ring.edge { stroke-width: 1.6; stroke-dasharray: 5 5; opacity: .55; }
.longitudinal-symbol circle.outer { fill: var(--surface); stroke: var(--longitudinal); stroke-width: 1.5; }
.longitudinal-symbol circle.dot { fill: var(--longitudinal); }
.longitudinal-symbol { opacity: .7; }
.swirl-path {
  fill: none;
  stroke: var(--transverse);
  stroke-width: 2.6;
  stroke-linecap: round;
  opacity: .72;
}
.swirl-guide { fill: none; stroke: var(--transverse); stroke-width: 1.1; stroke-dasharray: 4 7; opacity: 0; }
.r-vector { stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; }
.gperp-vector { stroke: var(--transverse); stroke-width: 3.2; stroke-linecap: round; opacity: 0; }
.sample-halo { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.sample-dot { fill: var(--accent); }
.gz-halo { fill: var(--surface); stroke: var(--longitudinal); stroke-width: 1.8; }
.gz-dot { fill: var(--longitudinal); }
.vector-label {
  fill: var(--ink);
  font-family: var(--math-font);
  font-size: 18px;
  font-style: italic;
  font-weight: 620;
  paint-order: stroke;
  stroke: var(--surface-muted);
  stroke-width: 5px;
  stroke-linejoin: round;
}
.vector-label.longitudinal { fill: var(--longitudinal); }
.vector-label.transverse { fill: var(--transverse); opacity: 0; }
.axis-symbol circle { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.axis-symbol .dot { fill: var(--ink); }
.axis-symbol text { fill: var(--ink); font-family: var(--math-font); font-size: 17px; font-style: italic; }
.rotation-arc { fill: none; stroke: var(--transverse); stroke-width: 3; stroke-linecap: round; opacity: 0; }
.rotation-label { fill: var(--transverse); font-family: var(--math-font); font-size: 17px; font-style: italic; opacity: 0; }
.field-card { fill: color-mix(in srgb, var(--surface) 96%, transparent); stroke: var(--border); stroke-width: 1; }
.field-track { fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
.field-arrow { stroke-width: 3; stroke-linecap: round; }
.field-tip { stroke: none; }
.field-origin { fill: var(--ink); }
.field-title { fill: var(--muted); font-family: var(--sans); font-size: 10.5px; font-weight: 760; letter-spacing: .08em; text-transform: uppercase; }
.field-state { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.logic-panel { display: grid; grid-template-rows: auto auto auto 1fr; }
.logic-body { display: grid; background: var(--surface-muted); }
.logic-row {
  display: grid;
  grid-template-columns: 94px 18px 68px 25px minmax(86px, 1fr);
  gap: 7px;
  align-items: center;
  min-height: 105px;
  padding: 11px 12px;
  background: color-mix(in srgb, var(--surface) 78%, var(--surface-muted));
  transition: opacity .2s ease, background .2s ease;
}
.logic-row + .logic-row { border-top: 1px solid var(--border); }
.logic-row.inactive { opacity: .38; }
.icon-card {
  min-width: 0;
  display: grid;
  place-items: center;
  min-height: 72px;
  padding: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.icon-card svg { display: block; width: 76px; height: 54px; overflow: visible; }
.logic-sign {
  color: var(--muted);
  font-family: var(--math-font);
  font-size: 1.35rem;
  text-align: center;
}
.logic-result {
  min-width: 0;
  display: grid;
  gap: 5px;
  align-content: center;
}
.logic-result .formula {
  color: var(--ink);
  font-size: clamp(.74rem, 1.12vw, .91rem);
  line-height: 1.2;
}
.logic-result .verdict {
  justify-self: start;
  padding: 3px 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: .61rem;
  font-weight: 650;
  white-space: nowrap;
}
.logic-result .verdict.active {
  border-color: color-mix(in srgb, var(--transverse) 46%, var(--border));
  color: var(--transverse);
}
.profile-block {
  padding: 10px 12px 11px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.profile-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
}
.profile-heading strong {
  color: var(--ink);
  font-size: .66rem;
  font-weight: 760;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.profile-heading span {
  color: var(--muted);
  font-size: .69rem;
  text-align: right;
}
.profile-wrap { position: relative; }
#profilePlot { display: block; width: 100%; height: auto; border: 1px solid var(--border); background: var(--surface-muted); }
.profile-axis { stroke: var(--border-strong); stroke-width: 1; }
.profile-curve { fill: none; stroke: var(--profile); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.profile-area { fill: color-mix(in srgb, var(--profile) 13%, transparent); }
.profile-sample { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
.profile-point { fill: var(--accent); }
.profile-label { fill: var(--muted); font-family: var(--sans); font-size: 11px; }
.profile-math { fill: var(--ink); font-family: var(--math-font); font-size: 14px; font-style: italic; opacity: 0; }
.profile-readout {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 35px;
  margin-top: 7px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  background: var(--surface-muted);
  color: var(--ink);
  font-size: clamp(.72rem, 1vw, .84rem);
  text-align: center;
}
.profile-readout strong { color: var(--transverse); font-weight: 700; }
.interpretation {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.readout-cell {
  min-width: 0;
  display: grid;
  align-content: center;
  gap: 4px;
  min-height: 64px;
  padding: 8px 9px;
  text-align: center;
}
.readout-cell + .readout-cell { border-left: 1px solid var(--border); }
.readout-cell span {
  color: var(--muted);
  font-size: .58rem;
  font-weight: 760;
  letter-spacing: .075em;
  text-transform: uppercase;
}
.readout-cell strong {
  color: var(--ink);
  font-family: var(--math-font);
  font-size: clamp(.75rem, 1.08vw, .90rem);
  font-weight: 600;
  line-height: 1.18;
}
.readout-cell strong.transverse { color: var(--transverse); }
.key-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--border);
  border-top: 0;
  background: var(--surface);
}
.key-item {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 8px;
  color: var(--muted);
  font-size: clamp(.67rem, 1.05vw, .77rem);
  line-height: 1.25;
  text-align: center;
}
.key-item + .key-item { border-left: 1px solid var(--border); }
.key-symbol { flex: 0 0 auto; position: relative; width: 22px; height: 16px; }
.key-symbol.gz::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 12px;
  height: 12px;
  border: 1.6px solid var(--longitudinal);
  border-radius: 50%;
}
.key-symbol.gz::after {
  content: "";
  position: absolute;
  left: 9px;
  top: 6px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--longitudinal);
}
.key-symbol.gp::before { content: ""; position: absolute; left: 1px; right: 4px; top: 8px; border-top: 3px solid var(--transverse); }
.key-symbol.gp::after { content: ""; position: absolute; right: 2px; top: 4px; width: 7px; height: 7px; border-top: 2px solid var(--transverse); border-right: 2px solid var(--transverse); transform: rotate(45deg); }
.key-symbol.profile { border: 1px solid var(--profile); background: color-mix(in srgb, var(--profile) 13%, transparent); }
.key-symbol.radius::before { content: ""; position: absolute; left: 1px; right: 3px; top: 8px; border-top: 3px solid var(--accent); }
.key-symbol.radius::after { content: ""; position: absolute; right: 1px; top: 4px; width: 7px; height: 7px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); transform: rotate(45deg); }
@media (max-width: 930px) {
  .topbar { grid-template-columns: 1fr; }
  .controls { justify-self: stretch; grid-template-columns: 1fr 160px auto; }
  .scenario-tabs { grid-template-columns: repeat(3, 1fr); }
  .main-grid { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  body { padding: 5px; }
  .topbar { padding: 14px; }
  .controls { grid-template-columns: 1fr; }
  .phase-control { order: 3; }
  .helicity-control { order: 2; }
  .helicity-control { grid-template-columns: repeat(2, 1fr); }
  .scenario-button { padding-inline: 5px; font-size: .58rem; white-space: normal; }
  .logic-row { grid-template-columns: 73px 15px 55px 19px minmax(76px, 1fr); gap: 5px; padding: 8px; }
  .icon-card { min-height: 62px; padding: 4px; }
  .icon-card svg { width: 62px; height: 47px; }
  .key-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .key-item:nth-child(3), .key-item:nth-child(4) { border-top: 1px solid var(--border); }
  .key-item:nth-child(3) { border-left: 0; }
}
@media (max-width: 430px) {
  .figure { padding: 7px; }
  .panel-head { align-items: flex-start; flex-direction: column; gap: 3px; }
  .panel-head span { text-align: left; }
  .logic-row { grid-template-columns: 58px 12px 48px 15px minmax(68px, 1fr); }
  .logic-result .formula { font-size: .67rem; }
  .logic-result .verdict { font-size: .53rem; padding-inline: 4px; }
  .interpretation { grid-template-columns: 1fr; }
  .readout-cell { min-height: 48px; }
  .readout-cell + .readout-cell { border-left: 0; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>
<main class="viz">
  <header class="topbar">
    <div>
      <div class="heading-row">
        <p class="eyebrow">angular momentum density</p>
        <h1>Only transverse momentum can turn about the beam axis</h1>
      </div>
      <p class="definition">
        At one point in the beam cross-section, decompose \(\vec g=\vec g_\perp+g_z\hat z\). The marked geometry shows which part survives in \(\hat z\!\cdot(\vec r\times\vec g)\).
      </p>
    </div>

    <div class="controls" aria-label="Visualization controls">
      <div class="scenario-tabs" role="group" aria-label="Choose the field model">
        <button class="scenario-button" type="button" data-state="linear" aria-pressed="true">linear</button>
        <button class="scenario-button" type="button" data-state="circular-uniform" aria-pressed="false">circular · uniform</button>
        <button class="scenario-button" type="button" data-state="circular-finite" aria-pressed="false">circular · finite</button>
      </div>
      <label class="phase-control" for="phaseInput">
        <span class="phase-label"><span>phase</span><strong id="phaseValue">0°</strong></span>
        <input id="phaseInput" type="range" min="0" max="360" step="1" value="0" aria-label="Set the E-vector phase">
      </label>
      <div class="helicity-control is-disabled" id="helicityControl" role="group" aria-label="Choose circular polarization helicity">
        <button class="helicity-button" type="button" data-helicity="1" aria-pressed="true" aria-label="Positive helicity">↺</button>
        <button class="helicity-button" type="button" data-helicity="-1" aria-pressed="false" aria-label="Negative helicity">↻</button>
      </div>
    </div>
  </header>

  <figure class="figure">
    <div class="main-grid">
      <section class="panel">
        <div class="panel-head">
          <strong>beam cross-section; +z points out of the page</strong>
          <span id="beamSubtitle">the field tip moves on one line</span>
        </div>
        <div class="beam-wrap">
          <svg id="beamPlot" viewBox="0 0 650 500" role="img" aria-labelledby="beamTitle beamDescription" preserveAspectRatio="xMidYMid meet">
            <title id="beamTitle">Momentum density in a beam cross-section</title>
            <desc id="beamDescription">A marked transverse position vector, longitudinal momentum symbols, and transverse circulation for a finite circular beam.</desc>
            <defs>
              <radialGradient id="finiteGradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="var(--longitudinal)" stop-opacity=".18"></stop>
                <stop offset="46%" stop-color="var(--longitudinal)" stop-opacity=".13"></stop>
                <stop offset="72%" stop-color="var(--profile)" stop-opacity=".10"></stop>

                <circle cx="12" cy="42" r="3" fill="var(--ink)"></circle>
                <text x="34" y="25" fill="var(--ink)" font-family="var(--math-font)" font-size="17" font-style="italic">r</text>
              </svg>
            </div>
            <div class="logic-sign">×</div>
            <div class="icon-card" aria-label="Longitudinal momentum density">
              <svg viewBox="0 0 76 54" aria-hidden="true">
                <circle cx="38" cy="27" r="15" fill="var(--surface)" stroke="var(--longitudinal)" stroke-width="2"></circle>

                <text x="38" y="52" text-anchor="middle" fill="var(--longitudinal)" font-family="var(--math-font)" font-size="13" font-style="italic">g<tspan baseline-shift="sub" font-size="9">z</tspan> ẑ</text>

                <path d="M54 12 L63 12 L59 21" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                <circle cx="12" cy="42" r="3" fill="var(--ink)"></circle>
                <text x="34" y="25" fill="var(--ink)" font-family="var(--math-font)" font-size="17" font-style="italic">r</text>
              </svg>
            </div>
            <div class="logic-sign">×</div>
            <div class="icon-card" aria-label="Transverse momentum density">
              <svg id="gPerpIcon" viewBox="0 0 76 54" aria-hidden="true">
                <line x1="14" y1="38" x2="58" y2="16" stroke="var(--transverse)" stroke-width="3" stroke-linecap="round"></line>
                <path d="M51 15 L61 15 L57 24" fill="none" stroke="var(--transverse)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                <text x="39" y="50" text-anchor="middle" fill="var(--transverse)" font-family="var(--math-font)" font-size="14" font-style="italic">g⊥</text>
              </svg>
            </div>
            <div class="logic-sign">→</div>
            <div class="logic-result">
              <div class="formula">\(\vec r\times\vec g_\perp\) points along the beam axis</div>

              <line class="profile-axis" x1="37" y1="124" x2="37" y2="18"></line>

              <path id="profileCurve" class="profile-curve"></path>

              <text id="profileAnnotation" class="profile-math" x="202" y="43" text-anchor="middle">∇⊥I = 0</text>

            </div>

            <strong id="pathReadout">line</strong>

            <span>transverse momentum</span>
            <strong id="gPerpReadout">\(\vec g_\perp=0\)</strong>
          </div>
          <div class="readout-cell">

            <strong id="lzReadout">\(L_z=0\)</strong>

      <div class="key-item"><i class="key-symbol gz"></i><span>\(g_z\hat z\): momentum along propagation</span></div>
      <div class="key-item"><i class="key-symbol gp"></i><span>\(\vec g_\perp\): momentum within the cross-section</span></div>
      <div class="key-item"><i class="key-symbol radius"></i><span>\(\vec r\): distance from the beam axis</span></div>
      <div class="key-item"><i class="key-symbol profile"></i><span>finite profile: a lateral edge and gradient</span></div>
    </div>
  </figure>
</main>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const stateButtons = [...document.querySelectorAll(".scenario-button")];
  const helicityButtons = [...document.querySelectorAll(".helicity-button")];
  const phaseInput = document.getElementById("phaseInput");
  const phaseValue = document.getElementById("phaseValue");
  const helicityControl = document.getElementById("helicityControl");
  const beamPlot = document.getElementById("beamPlot");
  const profilePlot = document.getElementById("profilePlot");
  const beamSubtitle = document.getElementById("beamSubtitle");
  const profileSubtitle = document.getElementById("profileSubtitle");
  const profileReadout = document.getElementById("profileReadout");
  const profileAnnotation = document.getElementById("profileAnnotation");
  const pathReadout = document.getElementById("pathReadout");
  const gPerpReadout = document.getElementById("gPerpReadout");
  const lzReadout = document.getElementById("lzReadout");
  const transverseLogicRow = document.getElementById("transverseLogicRow");
  const transverseVerdict = document.getElementById("transverseVerdict");

  const uniformField = document.getElementById("uniformField");
  const finiteField = document.getElementById("finiteField");
  const profileRings = document.getElementById("profileRings");
  const longitudinalField = document.getElementById("longitudinalField");
  const swirlField = document.getElementById("swirlField");
  const swirlGuide = document.getElementById("swirlGuide");
  const gPerpVector = document.getElementById("gPerpVector");
  const gPerpLabel = document.getElementById("gPerpLabel");
  const rotationArc = document.getElementById("rotationArc");
  const rotationLabel = document.getElementById("rotationLabel");
  const fieldTrackLine = document.getElementById("fieldTrackLine");
  const fieldTrackCircle = document.getElementById("fieldTrackCircle");
  const fieldArrow = document.getElementById("fieldArrow");
  const fieldTip = document.getElementById("fieldTip");
  const fieldState = document.getElementById("fieldState");
  const rMath = document.getElementById("rMath");
  const gPerpMath = document.getElementById("gPerpMath");
  const gZMath = document.getElementById("gZMath");
  const lzMath = document.getElementById("lzMath");
  const profileMath = document.getElementById("profileMath");

  const profileCurve = document.getElementById("profileCurve");
  const profileArea = document.getElementById("profileArea");
  const profileSample = document.getElementById("profileSample");
  const profilePoint = document.getElementById("profilePoint");

  const center = { x: 324, y: 245 };
  const sample = { radius: 148, angle: 32 * Math.PI / 180 };
  const samplePoint = {
    x: center.x + sample.radius * Math.cos(sample.angle),
    y: center.y - sample.radius * Math.sin(sample.angle)
  };

  let state = "linear";
  let helicity = 1;
  let phaseDegrees = 0;
  let mathReady = false;
  let lastReportedHeight = 0;

  function svgElement(name, attributes = {}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }

  function placeMathChip(element, x, y, dx = 0, dy = 0, viewWidth = 650, viewHeight = 500) {
    if (!element) return;
    element.style.left = `${(100 * x / viewWidth).toFixed(3)}%`;
    element.style.top = `${(100 * y / viewHeight).toFixed(3)}%`;
    element.style.marginLeft = `${dx}px`;
    element.style.marginTop = `${dy}px`;
  }

  function updateOverlayPositions() {
    placeMathChip(rMath, 390, 194, 0, -2);
    const gPerpVisible = state === "circular-finite";
    const lzVisible = state === "circular-finite";
    gPerpMath.style.opacity = gPerpVisible ? "1" : "0";
    lzMath.style.opacity = lzVisible ? "1" : "0";
    gPerpMath.style.display = gPerpVisible ? "block" : "none";
    lzMath.style.display = lzVisible ? "block" : "none";
    placeMathChip(gZMath, 494, 155);
    if (gPerpVisible) {
      const gx = Number(gPerpLabel.getAttribute("x")) || 411;
      const gy = Number(gPerpLabel.getAttribute("y")) || 115;
      placeMathChip(gPerpMath, gx, gy);
    }
    if (lzVisible) {
      const lx = Number(rotationLabel.getAttribute("x")) || 355;
      const ly = Number(rotationLabel.getAttribute("y")) || 288;
      placeMathChip(lzMath, lx, ly);
    }
    const px = Number(profileAnnotation.getAttribute("x")) || 205;
    const py = Number(profileAnnotation.getAttribute("y")) || 66;
    placeMathChip(profileMath, px, py, 0, 0, 390, 150);
  }

  function renderFieldVector() {
    const circular = state !== "linear";
    const cx = 78;
    const cy = 76;
    const radius = 43;
    const phase = phaseDegrees * Math.PI / 180;
    let x;
    let y;

    if (circular) {
      const angle = helicity * phase;
      x = cx + radius * Math.cos(angle);
      y = cy - radius * Math.sin(angle);
    } else {
      x = cx + radius * Math.cos(phase);
      y = cy;
    }

    fieldArrow.setAttribute("x1", cx);
    fieldArrow.setAttribute("y1", cy);
    fieldArrow.setAttribute("x2", x.toFixed(2));
    fieldArrow.setAttribute("y2", y.toFixed(2));
    fieldTip.setAttribute("cx", x.toFixed(2));
    fieldTip.setAttribute("cy", y.toFixed(2));
    phaseValue.textContent = `${Math.round(phaseDegrees)}°`;
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.textContent = "";
    for (let x = 76; x < 622; x += 49.5) {
      grid.appendChild(svgElement("line", { class: "grid-line", x1: x, y1: 24, x2: x, y2: 464 }));
    }
    for (let y = 68; y < 464; y += 44) {
      grid.appendChild(svgElement("line", { class: "grid-line", x1: 28, y1: y, x2: 622, y2: y }));
    }
  }

  function intensityAt(x, y) {
    if (state !== "circular-finite") return 1;
    const dx = x - center.x;
    const dy = y - center.y;
    const r = Math.hypot(dx, dy);
    return Math.exp(-1.55 * (r / 180) ** 2);
  }

  function renderLongitudinalField() {
    longitudinalField.textContent = "";
    const xs = [86, 146, 206, 266, 326, 386, 446, 506, 566];
    const ys = [76, 132, 188, 244, 300, 356, 412];
    ys.forEach(y => {
      xs.forEach(x => {
        const intensity = intensityAt(x, y);
        if (state === "circular-finite" && intensity < .075) return;
        const group = svgElement("g", {
          class: "longitudinal-symbol",
          transform: `translate(${x} ${y})`,
          opacity: (state === "circular-finite" ? .18 + .78 * intensity : .62).toFixed(3)
        });
        const radius = state === "circular-finite" ? 4.2 + 2.8 * intensity : 6.1;
        group.appendChild(svgElement("circle", { class: "outer", r: radius.toFixed(2) }));
        group.appendChild(svgElement("circle", { class: "dot", r: Math.max(1.35, radius * .27).toFixed(2) }));
        longitudinalField.appendChild(group);
      });
    });
  }

  function arcPath(cx, cy, radius, startAngle, endAngle) {
    const start = {
      x: cx + radius * Math.cos(startAngle),
      y: cy - radius * Math.sin(startAngle)
    };
    const end = {
      x: cx + radius * Math.cos(endAngle),
      y: cy - radius * Math.sin(endAngle)
    };
    const sweep = endAngle > startAngle ? 0 : 1;
    const large = Math.abs(endAngle - startAngle) > Math.PI ? 1 : 0;
    return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${radius} ${radius} 0 ${large} ${sweep} ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
  }

  function renderSwirlField() {
    swirlField.textContent = "";
    if (state !== "circular-finite") return;

    const count = 10;
    for (let i = 0; i < count; i += 1) {
      const mid = 2 * Math.PI * i / count;
      const half = .20;
      const start = helicity > 0 ? mid - half : mid + half;
      const end = helicity > 0 ? mid + half : mid - half;
      const path = svgElement("path", {
        class: "swirl-path",
        d: arcPath(center.x, center.y, 142, start, end),
        "marker-end": "url(#arrowTransverse)",
        opacity: ".88"
      });
      swirlField.appendChild(path);
    }
  }

  function renderLocalVectors() {
    const tangent = helicity > 0
      ? { x: -Math.sin(sample.angle), y: -Math.cos(sample.angle) }
      : { x: Math.sin(sample.angle), y: Math.cos(sample.angle) };
    const length = 92;
    const end = {
      x: samplePoint.x + length * tangent.x,
      y: samplePoint.y + length * tangent.y
    };

    gPerpVector.setAttribute("x1", samplePoint.x.toFixed(2));
    gPerpVector.setAttribute("y1", samplePoint.y.toFixed(2));
    gPerpVector.setAttribute("x2", end.x.toFixed(2));
    gPerpVector.setAttribute("y2", end.y.toFixed(2));
    gPerpLabel.setAttribute("x", (samplePoint.x + .62 * length * tangent.x + 8 * Math.cos(sample.angle)).toFixed(2));
    gPerpLabel.setAttribute("y", (samplePoint.y + .62 * length * tangent.y - 7 * Math.sin(sample.angle)).toFixed(2));

    const active = state === "circular-finite";
    gPerpVector.style.opacity = active ? "1" : "0";
    gPerpLabel.style.opacity = active ? "1" : "0";
    swirlGuide.style.opacity = active ? ".55" : "0";
    rotationArc.style.opacity = active ? "1" : "0";
    rotationLabel.style.opacity = active ? "1" : "0";

    const arcStart = helicity > 0 ? -.2 : 1.55;
    const arcEnd = helicity > 0 ? 1.55 : -.2;
    rotationArc.setAttribute("d", arcPath(center.x, center.y, 38, arcStart, arcEnd));
    rotationLabel.setAttribute("x", helicity > 0 ? "357" : "274");
    rotationLabel.setAttribute("y", helicity > 0 ? "289" : "207");
  }

  function renderProfile() {
    const left = 37;
    const right = 371;
    const top = 24;
    const bottom = 124;
    const sampleFraction = .70;
    let path = "";
    let area = "";
    let sampleY = top + 7;

    if (state === "circular-finite") {
      const points = [];
      for (let i = 0; i <= 90; i += 1) {
        const u = i / 90;
        const intensity = Math.exp(-2.25 * u * u);
        points.push({ x: left + u * (right - left), y: bottom - intensity * (bottom - top - 8) });
      }
      path = points.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(" ");
      area = `${path} L ${right} ${bottom} L ${left} ${bottom} Z`;
      const intensity = Math.exp(-2.25 * sampleFraction * sampleFraction);
      sampleY = bottom - intensity * (bottom - top - 8);
      profileAnnotation.textContent = "∇⊥I ≠ 0";
      profileAnnotation.setAttribute("x", "235");
      profileAnnotation.setAttribute("y", "45");
      profileSubtitle.textContent = "the selected point lies on the falling edge";
      profileReadout.innerHTML = "\\(\\nabla_\\perp I\\neq0\\;\\Longrightarrow\\;\\vec g_\\perp\\neq0\\)";
    } else {
      path = `M ${left} ${top + 19} L ${right} ${top + 19}`;
      area = `${path} L ${right} ${bottom} L ${left} ${bottom} Z`;
      sampleY = top + 19;
      profileAnnotation.textContent = "∇⊥I = 0";
      profileAnnotation.setAttribute("x", "205");
      profileAnnotation.setAttribute("y", "66");
      profileSubtitle.textContent = "no edge inside the ideal model";
      profileReadout.innerHTML = "\\(\\nabla_\\perp I=0\\;\\Longrightarrow\\;\\vec g_\\perp=0\\)";
    }

    profileCurve.setAttribute("d", path);
    profileArea.setAttribute("d", area);
    const sampleX = left + sampleFraction * (right - left);
    profileSample.setAttribute("x1", sampleX.toFixed(2));
    profileSample.setAttribute("x2", sampleX.toFixed(2));
    profileSample.setAttribute("y2", sampleY.toFixed(2));
    profilePoint.setAttribute("cx", sampleX.toFixed(2));
    profilePoint.setAttribute("cy", sampleY.toFixed(2));
  }

  function updateMathReadouts() {
    const circular = state !== "linear";
    const finite = state === "circular-finite";
    beamSubtitle.textContent = state === "linear"
      ? "the field tip moves on one line"
      : state === "circular-uniform"
        ? "the field rotates, but the profile has no edge"
        : "edge circulation reverses with helicity";

    pathReadout.textContent = circular ? "circle" : "line";
    gPerpReadout.innerHTML = finite ? "\\(\\vec g_\\perp\\neq0\\)" : "\\(\\vec g_\\perp=0\\)";
    gPerpReadout.classList.toggle("transverse", finite);

    if (state === "linear") {
      lzReadout.innerHTML = "\\(L_z=0\\)";
    } else if (state === "circular-uniform") {
      lzReadout.textContent = "not exposed locally";
    } else {
      lzReadout.innerHTML = helicity > 0 ? "\\(L_z>0\\)" : "\\(L_z<0\\)";
      lzReadout.classList.add("transverse");
    }
    if (state !== "circular-finite") lzReadout.classList.remove("transverse");

    transverseLogicRow.classList.toggle("inactive", !finite);
    transverseVerdict.textContent = finite
      ? (helicity > 0 ? "z-component > 0" : "z-component < 0")
      : "requires g⊥";

    if (mathReady && window.MathJax?.typesetPromise) {
      const nodes = [profileReadout, gPerpReadout, lzReadout, rMath, gPerpMath, gZMath, lzMath, profileMath];
      MathJax.typesetClear?.(nodes);
      MathJax.typesetPromise(nodes).then(() => { updateOverlayPositions(); reportHeight(); }).catch(() => {});
    }
  }

  function renderState() {
    const finite = state === "circular-finite";
    const circular = state !== "linear";

    stateButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.state === state)));
    helicityButtons.forEach(button => button.setAttribute("aria-pressed", String(Number(button.dataset.helicity) === helicity)));
    helicityControl.classList.toggle("is-disabled", !circular);

    uniformField.style.opacity = finite ? "0" : "1";
    finiteField.style.opacity = finite ? "1" : "0";
    profileRings.style.opacity = finite ? "1" : "0";

    fieldTrackLine.style.opacity = circular ? "0" : "1";
    fieldTrackCircle.style.opacity = circular ? "1" : "0";
    fieldState.textContent = circular ? "circle" : "line";
    fieldArrow.setAttribute("marker-end", circular ? "url(#arrowFieldCircular)" : "url(#arrowFieldLinear)");
    fieldArrow.style.stroke = circular ? "var(--profile)" : "var(--longitudinal)";
    fieldTip.style.fill = circular ? "var(--profile)" : "var(--longitudinal)";

    renderLongitudinalField();
    renderSwirlField();
    renderLocalVectors();
    renderProfile();
    renderFieldVector();
    updateMathReadouts();
    updateOverlayPositions();
    reportHeight();
  }

  stateButtons.forEach(button => {
    button.addEventListener("click", () => {
      state = button.dataset.state;
      renderState();
    });
  });

  helicityButtons.forEach(button => {
    button.addEventListener("click", () => {
      helicity = Number(button.dataset.helicity);
      renderState();
    });
  });

  phaseInput.addEventListener("input", () => {
    phaseDegrees = Number(phaseInput.value);
    renderFieldVector();
  });

  function reportHeight() {
    if (window.parent === window) return;
    const target = document.querySelector(".viz") || document.body;
    const rectangle = target.getBoundingClientRect();
    const height = Math.max(1, Math.ceil(rectangle.bottom + window.scrollY));
    if (Math.abs(height - lastReportedHeight) < 2) return;
    lastReportedHeight = height;
    try {
      const targetOrigin = window.location.origin === "null" ? "*" : window.location.origin;
      window.parent.postMessage({ type: "article-visualization-height", height }, targetOrigin);
    } catch (_) {}
  }

  function loadMathJax() {
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
      svg: { fontCache: "local" },
      startup: {
        typeset: false,
        ready() {
          MathJax.startup.defaultReady();
          MathJax.startup.promise
            .then(() => MathJax.typesetPromise([document.body]))
            .then(() => {
              mathReady = true;
              renderState();
              reportHeight();
            })
            .catch(() => {});
        }
      }
    };

    let source = "";
    try {
      source = [...window.parent.document.scripts]
        .map(script => script.src)
        .find(value => value && /mathjax/i.test(value)) || "";
    } catch (_) {}

    const script = document.createElement("script");
    script.async = true;
    script.src = source || "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js";
    document.head.appendChild(script);
  }

  renderGrid();
  renderState();
  loadMathJax();

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(reportHeight);
    observer.observe(document.querySelector(".viz") || document.body);
  }
  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", () => { updateOverlayPositions(); reportHeight(); });
})();
</script>
<script src="/assets/js/visualization-frame.js"></script>
</body>
